name: Keep Render instance alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://stagelink-api.onrender.com/api/health)
          echo "Render health returned HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi
