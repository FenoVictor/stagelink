name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: stagelink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, mysql, sqlite3
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      - name: Composer Audit
        working-directory: backend
        run: composer audit --format=json

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env || true
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stagelink_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stagelink_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run tests
        working-directory: backend
        run: |
          set -o pipefail
          php artisan test --display-errors --colors=never 2>&1 | tee test-output.log || status=$?
          status=${status:-0}
          grep -E "FAILED|Failed asserting|Error:|Exception|Errors:|Failures:|Tests:" test-output.log | while IFS= read -r line; do echo "::error::$line"; done
          exit $status

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
